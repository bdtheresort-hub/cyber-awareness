<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1e50"><title>Stay Safe | Cybersecurity Awareness</title>
<style>
:root{color-scheme:dark;--mint:#0ab9ac}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0e1237}body{font-family:Tahoma,Arial,sans-serif;color:white}.page{height:100vh;height:100dvh;display:grid;grid-template-rows:16% minmax(0,1fr) 13%;position:relative;isolation:isolate;background:linear-gradient(115deg,#1d1e50 0%,#1d1e50 50%,#0e1237 80%);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.page:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#0ab9ac09 1px,transparent 1px),linear-gradient(90deg,#0ab9ac09 1px,transparent 1px),radial-gradient(ellipse at 15% 50%,#0ab9ac18,transparent 55%);background-size:52px 52px,52px 52px,100% 100%;mask-image:linear-gradient(90deg,#000,transparent 85%)}.frame{width:min(88%,1050px);margin-inline:auto;min-height:0}header{display:flex;justify-content:space-between;align-items:center;direction:ltr;padding-block:14px;gap:24px}img{display:block;max-width:100%;object-fit:contain;min-height:0}.company{width:clamp(120px,20vw,215px);max-height:100%;height:auto}.campaign{width:clamp(58px,9vw,100px);max-height:100%;height:auto}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.66fr);grid-template-rows:minmax(0,1fr) auto;gap:20px 9%;padding-block:16px 24px}.hero{min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px}.eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;color:#a5e7e1;margin:0;flex:none}.eyebrow:before{content:"";width:6px;height:6px;background:var(--mint);border-radius:50%;box-shadow:0 0 14px #0ab9ac80}.message{height:calc(100% - 28px);width:100%;object-position:right center}.copy{align-self:end;min-width:0}.copy h1{font-size:clamp(16px,1.8vw,23px);line-height:1.45;margin:0 0 8px}.copy p{font-size:clamp(12px,1.15vw,15px);line-height:1.85;margin:0;color:#d1d3e4}.meter{grid-column:2;grid-row:1/3;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;direction:ltr;border:1px solid #858bb62a;border-top:3px solid var(--mint);background:#0e123755;box-shadow:0 24px 64px #05072233;animation:enter 1s .15s both;overflow:hidden}.fill{position:absolute;inset:auto 0 0;height:90%;background:linear-gradient(0deg,#272e6b,#353a76);transform-origin:bottom;transform:scaleY(1);border-top:1px solid #0ab9ac99}.ticks{position:absolute;inset:20px 12px;background:repeating-linear-gradient(to top,transparent 0,transparent calc(10% - 1px),#c2c8eb30 calc(10% - 1px),#c2c8eb30 10%);width:9px}.reading{position:relative;text-align:center;z-index:1}.number{font:700 clamp(48px,8.5vw,112px)/1 Arial,sans-serif;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.percent{font-size:.42em;letter-spacing:0;margin-left:5px}.meter-label{font-size:11px;color:#c5c9e5;margin-top:15px}.shield{position:absolute;top:7%;width:35px;height:40px;color:var(--mint);opacity:.85}.corner{position:absolute;width:16px;height:16px;border-color:var(--mint);border-style:solid;opacity:.8}.corner.a{top:13px;right:13px;border-width:1px 1px 0 0}.corner.b{bottom:13px;left:13px;border-width:0 0 1px 1px}footer{background:#0e123799;border-top:1px solid #0ab9ac40;min-height:0}.footer-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}.authority{width:clamp(145px,22vw,240px);max-height:100%;height:auto}.footer-mark{display:flex;gap:5px;direction:ltr}.footer-mark i{width:5px;height:5px;background:var(--mint);opacity:.35}.footer-mark i:nth-child(2){opacity:.65}.footer-mark i:last-child{width:38px;opacity:1}.reveal{animation:enter .8s cubic-bezier(.22,1,.36,1) both}.campaign{animation-delay:.08s}.hero{animation-delay:.16s}.copy{animation-delay:.3s}footer{animation-delay:.4s}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.page{grid-template-rows:15% minmax(0,1fr) 12%}main{grid-template-columns:minmax(0,1fr) minmax(0,.53fr);gap:20px 7%;padding-block:8px 20px}.hero{gap:10px}.eyebrow{font-size:9px}.message{height:calc(100% - 24px)}.meter{grid-row:1}.copy{grid-column:1/-1}.copy h1{font-size:18px;margin-bottom:7px}.copy p{font-size:13px;line-height:1.8}.number{font-size:clamp(40px,13vw,72px)}.meter-label{font-size:8px;margin-top:12px}.ticks{left:7px;width:5px}.shield{width:25px;height:29px}.footer-inner{padding-block:10px}}
@media(max-height:650px){main{padding-block:6px 12px;gap:10px 6%}.copy h1{font-size:15px;margin-bottom:4px}.copy p{font-size:11px;line-height:1.6}.eyebrow{font-size:9px}.hero{gap:8px}.message{height:calc(100% - 22px)}.meter-label{margin-top:8px}}
@media(max-height:450px) and (min-width:601px){.page{grid-template-rows:18% minmax(0,1fr) 15%}main{grid-template-columns:1fr .55fr 1fr;grid-template-rows:minmax(0,1fr);gap:5%}.hero{grid-column:1}.meter{grid-column:2;grid-row:1}.copy{grid-column:3;grid-row:1;align-self:center}.eyebrow{display:none}.message{height:100%}.number{font-size:54px}.shield{width:20px;height:24px}.meter-label{font-size:8px}header{padding-block:7px}.footer-inner{padding-block:7px}}
@media(prefers-reduced-motion:reduce){.reveal,.meter{animation:none}}
/* English campaign assets retain their original aspect ratios. */
main{grid-template-columns:minmax(0,1fr) minmax(0,.5fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:24px 7%}
.hero{justify-content:center}.message{height:auto;max-height:calc(100% - 30px);object-position:left center}
.copy{align-self:stretch;display:flex;align-items:center;min-height:0}.warning{width:100%;height:100%;object-fit:contain;object-position:left center}
.meter-label{padding-inline:12px;line-height:1.5}.eyebrow{letter-spacing:.12em}
@media(max-width:600px){main{grid-template-columns:minmax(0,1fr) minmax(0,.43fr);grid-template-rows:minmax(0,1fr) minmax(0,.85fr);gap:18px 6%}.hero{justify-content:center}.eyebrow{font-size:8px;letter-spacing:.06em}.message{height:auto;max-height:calc(100% - 24px)}.copy{grid-column:1/-1}.warning{object-position:left center}.meter-label{font-size:8px;padding-inline:7px}}
@media(max-height:450px) and (min-width:601px){main{grid-template-columns:1fr .5fr 1fr;grid-template-rows:minmax(0,1fr);gap:5%}.copy{align-self:stretch}.message{max-height:100%}.meter-label{font-size:8px}}</style></head><body><div class="page">
<header class="frame" aria-label="Campaign partners"><img class="company reveal" src="assets/company.png" width="1252" height="568" alt="AWJ Holding Company"><img class="campaign reveal" src="assets/campaign.png" width="617" height="581" alt="Leave no room for cyber threats"></header>
<main class="frame"><section class="hero reveal" aria-label="Campaign message"><p class="eyebrow">CYBERSECURITY AWARENESS</p><img class="message" src="assets/message-en.png" width="1767" height="761" alt="Hacking success probability — #STAY_SAFE"></section><section class="copy reveal" aria-label="QR code safety"><img class="warning" src="assets/text-en.png" width="1680" height="763" alt="Not every QR code is safe. Before scanning any QR code in a public place, make sure of its source and that it is not pasted over a legitimate code. Some codes take you to fake websites that steal your passwords or banking information, or trick you into downloading malicious files."></section>
<div class="meter" role="img" aria-label="Hacking success probability: 90 percent, as shown in the campaign artwork"><div class="fill" aria-hidden="true"></div><div class="ticks" aria-hidden="true"></div><svg class="shield" viewBox="0 0 32 38" fill="none" aria-hidden="true"><path d="M16 2 29 7v11c0 8-6 14-13 18C9 32 3 26 3 18V7L16 2Z" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="16" width="10" height="9" rx="1.5" stroke="currentColor"/><path d="M13 16v-3a3 3 0 0 1 6 0v3" stroke="currentColor"/></svg><div class="reading" aria-hidden="true"><div class="number"><span id="count">90</span><span class="percent">%</span></div><div class="meter-label">Hacking success probability</div></div><i class="corner a" aria-hidden="true"></i><i class="corner b" aria-hidden="true"></i></div></main>
<footer class="reveal"><div class="frame footer-inner"><img class="authority" src="assets/authority.png" width="1337" height="506" alt="National Cybersecurity Authority"><span class="footer-mark" aria-hidden="true"><i></i><i></i><i></i></span></div></footer></div>
<script>
(()=>{const count=document.getElementById('count'),fill=document.querySelector('.fill'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let frame,start;function finish(){cancelAnimationFrame(frame);count.textContent='90';fill.style.transform='scaleY(1)'}if(reduced.matches){finish();return}count.textContent='0';fill.style.transform='scaleY(0)';function animate(time){if(start===undefined)start=time+250;const progress=Math.min(1,Math.max(0,(time-start)/1800)),eased=1-Math.pow(1-progress,3);count.textContent=String(Math.round(90*eased));fill.style.transform=`scaleY(${eased})`;if(progress<1)frame=requestAnimationFrame(animate)}frame=requestAnimationFrame(animate);reduced.addEventListener('change',e=>{if(e.matches)finish()})})();
</script></body></html>
