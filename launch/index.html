<html lang="en" dir="ltr">
<head>

<meta name="theme-color" content="#1d1e50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cybersecurity Awareness | Official Launch</title>
<style>
:root{color-scheme:dark;--teal:#0ab9ac;--navy:#1d1e50;--deep:#0e1237}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:var(--deep);color:#fff}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid white;outline-offset:8px}
.stage{height:100vh;height:100dvh;min-height:0;display:grid;grid-template-rows:18% minmax(0,1fr) 13%;padding:max(22px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left));position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 53%,#0ab9ac14,transparent 48%),linear-gradient(120deg,#1d1e50 0%,#1d1e50 50%,#0e1237 85%)}
.stage:before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse,#000,transparent 78%)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:30px;min-height:0}img{display:block;object-fit:contain;max-height:100%;max-width:100%}.company{width:clamp(130px,18vw,205px)}.campaign{width:clamp(64px,9vw,92px)}main{display:grid;place-items:center;position:relative;min-height:0}
.launch-wrap{display:grid;place-items:center;position:absolute;inset:0;transition:opacity .65s,transform .8s}.orbit{position:absolute;width:min(55vh,62vw,440px);aspect-ratio:1;border:1px solid #0ab9ac24;border-radius:50%;pointer-events:none}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;inset:24px;border:1px dashed #0ab9ac24}.orbit:after{inset:-28px;border:1px solid #ffffff06}.launch{position:relative;width:min(35vh,43vw,280px);aspect-ratio:1;border-radius:50%;border:1px solid #57e5d8a0;background:radial-gradient(circle at 35% 25%,#20c7b9,#07988d 70%);box-shadow:0 0 0 10px #0ab9ac09,0 0 70px #0ab9ac28,inset 0 1px 2px #ffffff70;cursor:pointer;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:breathe 3.5s ease-in-out infinite;transition:filter .2s,transform .2s}.launch:hover{filter:brightness(1.1)}.launch:active{transform:scale(.97)}.launch svg{width:38px;height:38px}.launch span{letter-spacing:.24em;font-size:clamp(16px,2.3vw,24px);font-weight:700;padding-left:.24em}
.ready .launch-wrap{opacity:0;transform:scale(1.15);pointer-events:none}.result{text-align:center;max-width:850px;position:relative;padding:12px;opacity:0;transform:translateY(16px);transition:opacity .8s .35s,transform .8s .35s;visibility:hidden}.ready .result{opacity:1;transform:none;visibility:visible}.seal{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border-radius:50%;background:#0ab9ac14;border:1px solid #0ab9ac66;box-shadow:0 0 70px #0ab9ac22}.seal svg{width:35px;color:#55e5d4}.kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#67d8ce;margin:0 0 20px}h1{font-size:clamp(29px,5vw,64px);line-height:1.1;letter-spacing:-.045em;font-weight:500;margin:0 0 22px}h1 span{display:block;color:#79e1d5}.message{font-size:clamp(14px,1.7vw,20px);line-height:1.6;color:#c7cce0;margin:0 auto;max-width:560px}.message strong{color:#fff;font-weight:400}
footer{display:flex;justify-content:space-between;align-items:flex-end;min-height:0;gap:20px}.authority{width:clamp(160px,23vw,250px)}.controls{display:flex;align-items:center;gap:12px}.control{display:grid;place-items:center;background:#ffffff05;border:1px solid #ffffff20;color:#b8c6da;width:44px;height:44px;border-radius:50%;cursor:pointer}.control:hover{background:#ffffff10;color:white}.control svg{width:18px;height:18px}.reset{display:none}.ready .reset{display:grid}.notice{position:absolute;bottom:90px;right:32px;background:#0e1237;border:1px solid #0ab9ac55;border-radius:12px;padding:16px;max-width:300px;font-size:13px;line-height:1.6;z-index:5}.notice[hidden]{display:none}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,#0ab9ac35,transparent 68%);opacity:0}.ready .flash{animation:celebrate 1.8s ease-out forwards}.intro{animation:enter 1s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes breathe{50%{box-shadow:0 0 0 16px #0ab9ac05,0 0 90px #0ab9ac38,inset 0 1px 2px #ffffff70}}@keyframes celebrate{20%{opacity:1}100%{opacity:0}}
@media(max-width:600px){.stage{padding:24px;grid-template-rows:17% minmax(0,1fr) 14%}.company{width:140px}.campaign{width:65px}.launch{width:min(54vw,31vh)}.orbit{width:min(76vw,45vh)}.authority{width:165px}.seal{width:60px;height:60px;margin-bottom:18px}.kicker{font-size:9px;letter-spacing:.17em}.message{font-size:14px}.controls{gap:8px}.control{width:38px;height:38px}.notice{right:24px;left:24px;max-width:none}}
@media(max-height:500px){.stage{padding:15px 26px;grid-template-rows:19% minmax(0,1fr) 15%}.company{width:130px}.campaign{width:60px}.authority{width:155px}.seal{display:none}h1{font-size:32px;margin-bottom:12px}.kicker{margin-bottom:12px}.message{font-size:13px}.launch{gap:10px}.launch svg{width:26px;height:26px}.control{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}canvas{display:none}}
</style></head>

<script>
const stage=document.getElementById('stage'),launch=document.getElementById('launch'),result=document.getElementById('result'),reset=document.getElementById('reset'),full=document.getElementById('fullscreen'),notice=document.getElementById('notice'),canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)');let launched=false,frame,noticeTimer;
function stop(){cancelAnimationFrame(frame);ctx.clearRect(0,0,canvas.width,canvas.height)}
function celebrate(){stop();if(reduce.matches)return;const w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const colors=['#0ab9ac','#71ead9','#ffffff','#929bcf'];const bits=Array.from({length:130},()=>({x:w/2,y:h*.48,vx:(Math.random()-.5)*w*.9,vy:-150-Math.random()*h*.7,rot:Math.random()*6,spin:(Math.random()-.5)*8,size:4+Math.random()*5,color:colors[Math.floor(Math.random()*colors.length)]}));let start,last;function tick(t){if(!start){start=t;last=t}const dt=Math.min((t-last)/1000,.04),age=(t-start)/1000;last=t;ctx.clearRect(0,0,w,h);ctx.globalAlpha=Math.max(0,1-Math.max(0,age-2)/2);for(const p of bits){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=h*.42*dt;p.rot+=p.spin*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.55);ctx.restore()}if(age<4)frame=requestAnimationFrame(tick);else stop()}frame=requestAnimationFrame(tick)}
launch.addEventListener('click',()=>{if(launched)return;launched=true;launch.disabled=true;document.getElementById('launchWrap').setAttribute('aria-hidden','true');result.setAttribute('aria-hidden','false');stage.classList.add('ready');result.focus({preventScroll:true});celebrate()});
reset.addEventListener('click',()=>{if(!confirm('Reset the ceremony to the launch screen?'))return;stop();launched=false;stage.classList.remove('ready');result.setAttribute('aria-hidden','true');document.getElementById('launchWrap').removeAttribute('aria-hidden');launch.disabled=false;launch.focus({preventScroll:true})});
function hint(text){notice.textContent=text;notice.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.hidden=true,8500)}
full.addEventListener('click',async()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){await(document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen())}else{const request=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(!request){hint('For a fullscreen experience on this iPad, use Safari → Share → Add to Home Screen, then open the saved page.');return}await request.call(document.documentElement)}}catch(e){hint('Fullscreen is unavailable in this browser. On iPad, use Safari → Share → Add to Home Screen.')}});
function sync(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement);full.setAttribute('aria-label',active?'Exit fullscreen':'Enter fullscreen');full.title=active?'Exit fullscreen':'Enter fullscreen';full.setAttribute('aria-pressed',String(active))}
document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);reduce.addEventListener('change',e=>{if(e.matches)stop()});addEventListener('resize',stop);
